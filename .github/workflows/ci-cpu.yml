name: CI (CPU)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CPU deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Pytest (CPU, skip GPU/MLX)
        env:
          IDEAL_URL_STUB_EMBEDDER: "1"
        run: |
          pytest -m "not gpu and not mlx" \
            tests/test_stub_embedder.py \
            tests/test_canonical_url.py \
            tests/test_aggregator.py \
            tests/test_server_config.py \
            tests/test_jobs.py \
            tests/test_import_rust_sitemapper.py \
            --ignore=tests/test_all_methods.py \
            --ignore=tests/test_all_methods_comprehensive.py \
            --ignore=tests/test_production.py
